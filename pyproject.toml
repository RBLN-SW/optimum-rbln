[project]
name = "optimum-rbln"
description = """
Optimum RBLN is the interface between the HuggingFace Transformers and Diffusers libraries and RBLN accelerators.
It provides a set of tools enabling easy model loading and inference on single and multiple rbln device settings for different downstream tasks.
"""
authors = [
    {name = "Rebellions Inc.", email = "support@rebellions.ai"},
]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["transformers", "diffusers", "inference", "rbln", "atom", "rebel"]
dependencies = [
    "torch==2.11.0+cpu",
    "torchaudio==2.11.0; platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
    "torchaudio==2.11.0+cpu; platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
    "torchvision==0.26.0; platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
    "torchvision==0.26.0+cpu; platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
    "torchcodec==0.14.0; platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
    "torchcodec==0.14.0+cpu; platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
    "accelerate>=1.0.1",
    "transformers==5.15.1",
    "diffusers==0.38.0",
    "packaging>=24.1",
    "tokenizers==0.22.1",
]

[project.urls]
Homepage = "https://rebellions.ai"
Documentation = "https://docs.rbln.ai"
Repository = "https://github.com/rbln-sw/optimum-rbln"

[project.scripts]
optimum-rbln-cli = "optimum.rbln.cli:main"

[dependency-groups]
tests = [
    "pytest>=8.4.2",
    "pytest-xdist>=3.8.0",
    "pytest-split>=0.9.0",
    "psutil>=5.9.8",
    "parameterized>=0.9.0",
    "GitPython>=3.1.42",
    "sentencepiece>=0.2.0",
    "datasets>=2.18.0",
    "sacremoses>=0.1.1",
    "safetensors>=0.4.2",
    "protobuf>=5.27.2",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
    "simphile>=1.0.2",
]
quality = [
    "ruff>=0.15.4",
    "pre-commit>=4.0.0",
]
deploy = [
    "twine>=6.0.1",
]

[build-system]
# hatchling 1.32 bumped the emitted Metadata-Version to 2.5, which the twine 6.x
# pinned in the deploy job rejects ("'2.5' is not a valid metadata version").
# Cap at <1.32 so `uv build` emits 2.4 until the deploy stack (twine) moves up.
requires = ["hatchling<1.32", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/optimum/rbln/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/optimum"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.11.25"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and platform_python_implementation == 'CPython'",
    "sys_platform == 'linux' and platform_machine == 'aarch64' and platform_python_implementation == 'CPython'",
]
cache-keys = [{ git = { commit = true } }]
constraint-dependencies = [
    "torch==2.11.0+cpu",
    "torchaudio==2.11.0; platform_machine == 'aarch64' and platform_python_implementation == 'CPython' and sys_platform == 'linux'",
    "torchaudio==2.11.0+cpu; platform_machine == 'x86_64' and platform_python_implementation == 'CPython' and sys_platform == 'linux'",
    "torchvision==0.26.0; platform_machine == 'aarch64' and platform_python_implementation == 'CPython' and sys_platform == 'linux'",
    "torchvision==0.26.0+cpu; platform_machine == 'x86_64' and platform_python_implementation == 'CPython' and sys_platform == 'linux'",
    "torchcodec==0.14.0; platform_machine == 'aarch64' and platform_python_implementation == 'CPython' and sys_platform == 'linux'",
    "torchcodec==0.14.0+cpu; platform_machine == 'x86_64' and platform_python_implementation == 'CPython' and sys_platform == 'linux'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
doctest_optionflags = "NUMBER NORMALIZE_WHITESPACE ELLIPSIS"

[tool.ruff]
line-length = 119
extend-exclude = ["src/optimum/rbln/__version__.py"]

[tool.ruff.lint]
select = [
    "B",
    "C",
    "E",
    "F",
    "I",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR0402",
    "PLR1714",
    "PLR5501",
    "PLW",
    "PT",
    "RUF",
    "SIM",
    "TC",
    "UP",
    "W",
]
ignore = [
    "C901",
    "E501",
    "E741",
    "W605",
    "UP037",
    # Lazy imports inside functions are deliberate: they keep `import optimum.rbln` light.
    "PLC0415",
    # Mutable class attributes are the HuggingFace convention for declarative model metadata.
    "RUF012",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["optimum.rbln"]
known-third-party = ["optimum"]

[tool.ruff.lint.per-file-ignores]
# Ignore import violations in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "F811"]
