# optimum-rbln pytest suites, uploaded by .buildkite/pr.yml.
# Mirrors the GHA matrix in .github/workflows/rbln_optimum_pytest.yaml.
#
# The uploader picks the test level: default for an ordinary PR, full for a
# [pytest-full] commit (and later for the nightly). Both values are baked in at
# upload time, so a step's `if` below is already a constant when Buildkite
# evaluates it -- build.env() cannot see this env block.

notify:
  - github_commit_status:
      context: "[OB] Optimum-RBLN pytest"

env:
  UV_CACHE_DIR: "/mnt/uv_cache"
  UV_LINK_MODE: "symlink"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  OPTIMUM_RBLN_TEST_LEVEL: "${OPTIMUM_RBLN_TEST_LEVEL:-default}"
  # The hub tests push to a private repo under this namespace and skip themselves
  # while it is unset (tests/test_base.py require_hf_user_id), which is how they
  # stay out of an ordinary PR: only a full build's uploader exports it.
  HF_USER_ID: "${HF_USER_ID:-}"

# GHA spawns the advanced CLI jobs at every level and skips them inside; here the
# step is not created at all, so no NPU is held just to skip.
_full_only: &full_only
  if: "'${OPTIMUM_RBLN_TEST_LEVEL:-default}' == 'full'"

_secrets: &secrets
  UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
  UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
  HF_TOKEN: HF_TOKEN
  HF_HOME: HF_HOME
  # HF_TOKEN reads gated models; only this one may create a repo under
  # Rebellions, which is what test_push_to_hub does.
  HF_AUTH_TOKEN: MODEL_HUB_ACCESS

_sync: &sync "bash .buildkite/scripts/sync.sh"

_npu: &npu
  npu:
    count: 1
    product: "RBLN-CA25"

steps:
  - label: ":pytest: unit-cpu"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh unit-cpu"

  - label: ":pytest: config"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh config"

  - label: ":pytest: cli-basic"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh cli-basic"

  - label: ":pytest: cli-argument-parsing"
    <<: *full_only
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh cli-argument-parsing"

  - label: ":pytest: cli-error-handling"
    <<: *full_only
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh cli-error-handling"

  - label: ":pytest: transformers 1/3"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh transformers 1/3"

  - label: ":pytest: transformers 2/3"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh transformers 2/3"

  - label: ":pytest: transformers 3/3"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh transformers 3/3"

  - label: ":pytest: diffusers 1/2"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh diffusers 1/2"

  - label: ":pytest: diffusers 2/2"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh diffusers 2/2"

  - label: ":pytest: llm 1/6"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
      - *sync
      - "bash .buildkite/scripts/run-suite.sh llm 1/6"

  - label: ":pytest: llm 2/6"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    resources: *npu
    secrets: *secrets
    timeout_in_minutes: 60
    command:
