# Existing Chronos B1 lowering and SDK controls on scheduler-owned CA25.
env:
  # Where every release's compiled artifacts live, written by the tag build
  # (.buildkite/bc-compile.yml).
  BC_BASE_PATH: "${OPTIMUM_BC_BASE_PATH}"
  UV_CACHE_DIR: "${UV_CACHE_PATH}"
  UV_LINK_MODE: "copy"
  UV_INDEX_STRATEGY: "unsafe-best-match"

steps:
  - label: ":closed_lock_with_key: team-member gate"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets:
      - GIT_PAT
    command:
      - "bash scripts/ci/gate-team-member.sh"

  - label: ":mag: code quality"
    notify:
      - github_commit_status:
          context: "[OB] code quality"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "uv sync --locked --python 3.12 --group quality --no-install-project"
      - "uv run --no-sync ruff format --check ."
      - "uv run --no-sync ruff check ."
      - "uv run --no-sync mypy"
      - "uv run --no-sync python scripts/check_inits.py"
      # ruff and uv.lock are already checked above; this runs the remaining file hygiene hooks.
      - "SKIP=ruff-check,ruff-format,uv-lock uv run --no-sync pre-commit run --all-files --show-diff-on-failure"

  - label: ":page_facing_up: docstrings"
    notify:
      - github_commit_status:
          context: "[OB] docstrings"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "bash scripts/check-docstrings.sh"

  # All existing quality/doc gates precede the scheduler-owned CA25 slot.
  - wait: ~

  - label: ":package: Verify and stage existing Chronos B1 controls"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    timeout_in_minutes: 30
    command:
      - >-
        python3 -m scripts.diagnostics.chronos2_attention_isolation_stage
        --source /mnt/shared_data/users/jaehunryu/nas_data/model-enable-20261025/chronos-attention-variants67/bundle-legacy328
        --destination /mnt/cross_data/model-enable/jaehunryu/chronos2-b1-legacy328-v1
        --manifest-sha256 124301614a1fb04e2df2d11095918970b8ba957da02888f2961a72854ee728c2
      - >-
        python3 -m scripts.diagnostics.chronos2_attention_isolation_stage
        --source /mnt/shared_data/users/jaehunryu/nas_data/model-enable-20261025/chronos-attention-variants67/bundle-official342
        --destination /mnt/cross_data/model-enable/jaehunryu/chronos2-b1-official342-v1
        --manifest-sha256 0bbb04ba371cf2115d1c6055f38182c97832291f5c627936ea7bac98fb1f404b

  - wait: ~

  - label: ":microscope: Existing Chronos B1 legacy328 controls on CA25"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    resources:
      cpu:
        requests: "8"
      memory:
        requests: "16Gi"
        limits: "16Gi"
      npu:
        count: 1
        product: "RBLN-CA25"
    env:
      REBEL_COMPILER_VERSION: "0.12.1.dev329+g66a3078e"
      RBLN_TEST_NPU: "RBLN-CA25"
    secrets:
      UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
    timeout_in_minutes: 30
    artifact_paths:
      - "debug-chronos-b1/legacy328/**/*"
    command:
      - "bash scripts/ci/sync.sh"
      - "mkdir -p debug-chronos-b1/legacy328"
      - >-
        set -o pipefail;
        unset RBLN_DUMMY_DEVICE TVM_LIBRARY_PATH;
        uv run --no-sync python -m scripts.diagnostics.chronos2_attention_isolation_run
        --bundle /mnt/cross_data/model-enable/jaehunryu/chronos2-b1-legacy328-v1
        --manifest-sha256 124301614a1fb04e2df2d11095918970b8ba957da02888f2961a72854ee728c2
        --out debug-chronos-b1/legacy328/run1
        2>&1 | tee debug-chronos-b1/legacy328/runtime.log

  - label: ":microscope: Existing Chronos B1 official342 controls on CA25"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    resources:
      cpu:
        requests: "8"
      memory:
        requests: "16Gi"
        limits: "16Gi"
      npu:
        count: 1
        product: "RBLN-CA25"
    env:
      REBEL_COMPILER_VERSION: "0.12.1.dev342+gffa872ed"
      RBLN_TEST_NPU: "RBLN-CA25"
    secrets:
      UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
    timeout_in_minutes: 30
    artifact_paths:
      - "debug-chronos-b1/official342/**/*"
    command:
      - "bash scripts/ci/sync.sh"
      - "mkdir -p debug-chronos-b1/official342"
      - >-
        set -o pipefail;
        unset RBLN_DUMMY_DEVICE TVM_LIBRARY_PATH;
        uv run --no-sync python -m scripts.diagnostics.chronos2_attention_isolation_run
        --bundle /mnt/cross_data/model-enable/jaehunryu/chronos2-b1-official342-v1
        --manifest-sha256 0bbb04ba371cf2115d1c6055f38182c97832291f5c627936ea7bac98fb1f404b
        --out debug-chronos-b1/official342/run1
        2>&1 | tee debug-chronos-b1/official342/runtime.log
