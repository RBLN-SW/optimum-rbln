# Frozen full native Chronos B512 validation on scheduler-owned CA25.
env:
  # Where every release's compiled artifacts live, written by the tag build
  # (.buildkite/bc-compile.yml).
  BC_BASE_PATH: "${OPTIMUM_BC_BASE_PATH}"
  UV_CACHE_DIR: "${UV_CACHE_PATH}"
  UV_LINK_MODE: "copy"
  UV_INDEX_STRATEGY: "unsafe-best-match"

steps:
  - label: ":closed_lock_with_key: team-member gate"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets:
      - GIT_PAT
    command:
      - "bash scripts/ci/gate-team-member.sh"

  - label: ":mag: code quality"
    notify:
      - github_commit_status:
          context: "[OB] code quality"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "uv sync --locked --python 3.12 --group quality --no-install-project"
      - "uv run --no-sync ruff format --check ."
      - "uv run --no-sync ruff check ."
      - "uv run --no-sync mypy"
      - "uv run --no-sync python scripts/check_inits.py"
      # ruff and uv.lock are already checked above; this runs the remaining file hygiene hooks.
      - "SKIP=ruff-check,ruff-format,uv-lock uv run --no-sync pre-commit run --all-files --show-diff-on-failure"

  - label: ":page_facing_up: docstrings"
    notify:
      - github_commit_status:
          context: "[OB] docstrings"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "bash scripts/check-docstrings.sh"

  # All existing quality/doc gates precede the scheduler-owned CA25 slot.
  - wait: ~

  - label: ":package: Verify and stage existing Chronos temporal producer diagnostic"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    timeout_in_minutes: 30
    command:
      - >-
        python3 -m scripts.diagnostics.chronos2_temporal_producer_stage
        --source /mnt/shared_data/users/jaehunryu/nas_data/model-enable-20261025/chronos-temporal-producer56/selected-output57/bundle-run1
        --destination /mnt/cross_data/model-enable/jaehunryu/chronos2-ci819-temporal-producers-v1
        --manifest-sha256 0e44a75ce896475a74ae8a9a22a21d57ff0ccf78fd662c5166f6e5e689ce7eb8

  - wait: ~

  - label: ":microscope: Existing Chronos full512 true temporal producers on CA25"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    resources:
      cpu:
        requests: "16"
      memory:
        requests: "64Gi"
        limits: "64Gi"
      npu:
        count: 1
        product: "RBLN-CA25"
    env:
      REBEL_COMPILER_VERSION: "0.12.1.dev329+g66a3078e"
      RBLN_TEST_NPU: "RBLN-CA25"
    secrets:
      UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
    timeout_in_minutes: 30
    artifact_paths:
      - "debug-chronos-temporal-producers/**/*"
    command:
      - "bash scripts/ci/sync.sh"
      - "mkdir -p debug-chronos-temporal-producers"
      - >-
        set -o pipefail;
        unset RBLN_DUMMY_DEVICE TVM_LIBRARY_PATH;
        uv run --no-sync python -m scripts.diagnostics.chronos2_temporal_producer_run
        --bundle /mnt/cross_data/model-enable/jaehunryu/chronos2-ci819-temporal-producers-v1
        --manifest-sha256 0e44a75ce896475a74ae8a9a22a21d57ff0ccf78fd662c5166f6e5e689ce7eb8
        --out debug-chronos-temporal-producers/run1
        2>&1 | tee debug-chronos-temporal-producers/runtime.log
