# Existing Chronos B1 lowering and SDK controls on scheduler-owned CA25.
env:
  # Where every release's compiled artifacts live, written by the tag build
  # (.buildkite/bc-compile.yml).
  BC_BASE_PATH: "${OPTIMUM_BC_BASE_PATH}"
  UV_CACHE_DIR: "${UV_CACHE_PATH}"
  UV_LINK_MODE: "copy"
  UV_INDEX_STRATEGY: "unsafe-best-match"

steps:
  - label: ":closed_lock_with_key: team-member gate"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets:
      - GIT_PAT
    command:
      - "bash scripts/ci/gate-team-member.sh"

  - label: ":mag: code quality"
    notify:
      - github_commit_status:
          context: "[OB] code quality"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "uv sync --locked --python 3.12 --group quality --no-install-project"
      - "uv run --no-sync ruff format --check ."
      - "uv run --no-sync ruff check ."
      - "uv run --no-sync mypy"
      - "uv run --no-sync python scripts/check_inits.py"
      # ruff and uv.lock are already checked above; this runs the remaining file hygiene hooks.
      - "SKIP=ruff-check,ruff-format,uv-lock uv run --no-sync pre-commit run --all-files --show-diff-on-failure"

  - label: ":page_facing_up: docstrings"
    notify:
      - github_commit_status:
          context: "[OB] docstrings"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "bash scripts/check-docstrings.sh"

  # All existing quality/doc gates precede the scheduler-owned CA25 slot.
  - wait: ~

  - label: ":package: Verify and stage whole-model Chronos compiler-fix candidate"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    timeout_in_minutes: 30
    command:
      - >-
        python3 -m scripts.diagnostics.chronos2_candidate_validation
        --artifacts /mnt/shared_data/users/jaehunryu/nas_data/model-enable-20261025/chronos-whole-candidate69/bundle
        --stage-to /mnt/cross_data/model-enable/jaehunryu/chronos2-whole-candidate69-v1
        --manifest-sha256 c37bcba1ebb0963177db417be6241f7771291a1a07476034b8601d8fec875784

  - wait: ~

  - label: ":microscope: Sequential Chronos full-model B512 per-series parity on CA25"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    resources:
      cpu:
        requests: "16"
      memory:
        requests: "64Gi"
        limits: "64Gi"
      npu:
        count: 1
        product: "RBLN-CA25"
    env:
      REBEL_COMPILER_VERSION: "0.12.1.dev329+g66a3078e"
      RBLN_TEST_NPU: "RBLN-CA25"
      OPTIMUM_RBLN_TEST_LEVEL: "full"
    secrets:
      UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
      HF_TOKEN: HF_TOKEN
      HF_HOME: HF_HOME
    timeout_in_minutes: 120
    artifact_paths:
      - "debug-chronos-sequential-parity/**/*"
    command:
      - "bash scripts/ci/sync.sh"
      - "mkdir -p debug-chronos-sequential-parity"
      - >-
        set -o pipefail;
        unset RBLN_DUMMY_DEVICE TVM_LIBRARY_PATH;
        uv run --no-sync python -m scripts.diagnostics.chronos2_resident_validation
        --artifacts /mnt/cross_data/model-enable/jaehunryu/chronos2-whole-candidate69-v1
        --manifest-sha256 c37bcba1ebb0963177db417be6241f7771291a1a07476034b8601d8fec875784
        --out debug-chronos-sequential-parity/run1 --residency sequential
        2>&1 | tee debug-chronos-sequential-parity/runtime.log
