# Entry pipeline for PR builds. Gates run first; the pytest pipeline is uploaded
# only after they pass, with --git-diff-base so if_changed in that pipeline works.
env:
  UV_CACHE_DIR: "/mnt/uv_cache"
  UV_LINK_MODE: "symlink"
  UV_INDEX_STRATEGY: "unsafe-best-match"

# Every upload job reads only .buildkite; the suites they emit check out in full.
_upload: &upload
  checkout:
    sparse:
      paths:
        - .buildkite

steps:
  - label: ":closed_lock_with_key: team-member gate"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets:
      - GIT_PAT
    command:
      - "bash .buildkite/scripts/gate-team-member.sh"

  # Same checks as .github/workflows/check_code_quality.yml.
  - label: ":mag: ruff"
    notify:
      - github_commit_status:
          context: "[OB] code quality"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "uv sync --locked --python 3.12 --group quality --no-install-project"
      - "uv run --no-sync ruff format --check ."
      - "uv run --no-sync ruff check ."

  # Same check as .github/workflows/test-docstrings.yml.
  - label: ":page_facing_up: docstrings"
    notify:
      - github_commit_status:
          context: "[OB] docstrings"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "bash .buildkite/scripts/check-docstrings.sh"

  # All gates must pass before the NPU pipeline is even uploaded.
  - wait: ~

  # Each upload job is a sibling: two uploads from one job make the second batch
  # a barrier for the first, so the suites would wait on each other.
  #
  # A [pytest-full] commit (the compiler-update bot's PRs) runs every suite at the
  # full level and uploads without --git-diff-base: nothing is path-gated away.
  - label: ":sparkles: upload pytest"
    <<: *upload
    command: |
      if [[ "$$BUILDKITE_MESSAGE" == *"[pytest-full]"* ]]; then
        echo "--- :mag: [pytest-full] in commit message"
        export OPTIMUM_RBLN_TEST_LEVEL=full
      else
        TARGET_BRANCH=$${BUILDKITE_PULL_REQUEST_BASE_BRANCH:-dev}
        git fetch origin $$TARGET_BRANCH
        DIFF="--git-diff-base origin/$$TARGET_BRANCH"
      fi
      buildkite-agent pipeline upload .buildkite/pipelines/pytest/pipeline.yml $${DIFF:-}

  - label: ":sparkles: upload full CLI"
    <<: *upload
    command: |
      if [[ "$$BUILDKITE_MESSAGE" != *"[pytest-full]"* ]]; then
        echo "not a [pytest-full] build; the advanced CLI suites do not run"
        exit 0
      fi
      buildkite-agent pipeline upload .buildkite/pipelines/pytest/cli-full.yml
