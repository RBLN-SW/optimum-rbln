# Entry pipeline for PR builds. Gates run first; the test pipelines are uploaded
# only after they pass.
env:
  # Where every release's compiled artifacts live, written by the tag build
  # (.buildkite/bc-compile.yml).
  BC_BASE_PATH: "${OPTIMUM_BC_BASE_PATH}"
  UV_CACHE_DIR: "${UV_CACHE_PATH}"
  UV_LINK_MODE: "symlink"
  UV_INDEX_STRATEGY: "unsafe-best-match"

# Both upload jobs read only .buildkite and scripts; the suites they emit check out in full.
_upload: &upload
  checkout:
    sparse:
      paths:
        - .buildkite
        - scripts

steps:
  - label: ":closed_lock_with_key: team-member gate"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    secrets:
      - GIT_PAT
    command:
      - "bash scripts/ci/gate-team-member.sh"

  - label: ":mag: code quality"
    notify:
      - github_commit_status:
          context: "[OB] code quality"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "uv sync --locked --python 3.12 --group quality --no-install-project"
      - "uv run --no-sync ruff format --check ."
      - "uv run --no-sync ruff check ."
      - "uv run --no-sync mypy"
      - "uv run --no-sync python scripts/check_inits.py"
      # ruff and uv.lock are already checked above; this runs the remaining file hygiene hooks.
      - "SKIP=ruff-check,ruff-format,uv-lock uv run --no-sync pre-commit run --all-files --show-diff-on-failure"

  - label: ":page_facing_up: docstrings"
    notify:
      - github_commit_status:
          context: "[OB] docstrings"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    command:
      - "bash scripts/check-docstrings.sh"

  # All gates must pass before the NPU pipeline is even uploaded.
  - wait: ~

  # A [pytest-full] commit (the compiler-update bot's PRs) runs every suite at the
  # full level. Suites a change cannot affect are skipped with the [skip-*]
  # directives run-suite.sh reads, not by path.
  # Sibling jobs: two uploads from one job make the second batch a barrier for
  # the first, so the pytest suites would wait on BC.
  - label: ":microscope: CA25 native B512 encoder fresh process (diagnostic)"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    resources:
      cpu:
        requests: "16"
      memory:
        requests: "96Gi"
        limits: "96Gi"
      npu:
        count: 1
        product: "RBLN-CA25"
    secrets:
      UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
      HF_TOKEN: HF_TOKEN
      HF_HOME: HF_HOME
    env:
      RBLN_TEST_NPU: "RBLN-CA25"
      OPTIMUM_RBLN_TEST_LEVEL: "full"
    timeout_in_minutes: 120
    artifact_paths:
      - "junit-dinov2-ca25-encoder.xml"
    command:
      - "bash scripts/ci/sync.sh"
      - "rbln-smi"
      - "uv run --no-sync pytest -n 1 -s -vv tests/test_transformers.py -k 'TestDinov2ModelNativeSizeBatch512 and (test_generate or test_numerical_parity)' --junitxml=junit-dinov2-ca25-encoder.xml"

  - label: ":microscope: CA25 native B512 classifier fresh process (diagnostic)"
    image: "${DEVTOOLS_DOCKER_IMAGE}"
    agents:
      queue: k8s
    resources:
      cpu:
        requests: "16"
      memory:
        requests: "96Gi"
        limits: "96Gi"
      npu:
        count: 1
        product: "RBLN-CA25"
    secrets:
      UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
      UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
      HF_TOKEN: HF_TOKEN
      HF_HOME: HF_HOME
    env:
      RBLN_TEST_NPU: "RBLN-CA25"
      OPTIMUM_RBLN_TEST_LEVEL: "full"
    timeout_in_minutes: 120
    artifact_paths:
      - "junit-dinov2-ca25-classifier.xml"
    command:
      - "bash scripts/ci/sync.sh"
      - "rbln-smi"
      - "uv run --no-sync pytest -n 1 -s -vv tests/test_transformers.py -k 'TestDinov2ForImageClassificationNativeSizeBatch512 and (test_generate or test_numerical_parity)' --junitxml=junit-dinov2-ca25-classifier.xml"
