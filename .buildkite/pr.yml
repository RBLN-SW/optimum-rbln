env:
  BC_BASE_PATH: ${OPTIMUM_BC_BASE_PATH}
  UV_CACHE_DIR: ${UV_CACHE_PATH}
  UV_LINK_MODE: copy
  UV_INDEX_STRATEGY: unsafe-best-match
steps:
- label: ':closed_lock_with_key: team-member gate'
  image: ${DEVTOOLS_DOCKER_IMAGE}
  secrets:
  - GIT_PAT
  command:
  - bash scripts/ci/gate-team-member.sh
- label: ':mag: code quality'
  notify:
  - github_commit_status:
      context: '[OB] code quality'
  image: ${DEVTOOLS_DOCKER_IMAGE}
  command:
  - uv sync --locked --python 3.12 --group quality --no-install-project
  - uv run --no-sync ruff format --check .
  - uv run --no-sync ruff check .
  - uv run --no-sync mypy
  - uv run --no-sync python scripts/check_inits.py
  - SKIP=ruff-check,ruff-format,uv-lock uv run --no-sync pre-commit run --all-files
    --show-diff-on-failure
- label: ':page_facing_up: docstrings'
  notify:
  - github_commit_status:
      context: '[OB] docstrings'
  image: ${DEVTOOLS_DOCKER_IMAGE}
  command:
  - bash scripts/check-docstrings.sh
- wait: null
- label: ':pytest: Existing SigLIP2 SDK343 RBLN-CA25 B1/2/4/8'
  image: ${DEVTOOLS_DOCKER_IMAGE}
  agents:
    queue: k8s
  resources:
    cpu:
      requests: '16'
    memory:
      requests: 64Gi
      limits: 64Gi
    npu:
      count: 1
      product: RBLN-CA25
  env:
    REBEL_COMPILER_VERSION: 0.12.1.dev343+g8f59b810
    RBLN_TEST_NPU: RBLN-CA25
    OPTIMUM_RBLN_TEST_LEVEL: full
    HF_USER_ID: ''
  secrets:
    UV_INDEX_REBELLIONS_USERNAME: REBEL_SW_DEV_USERNAME
    UV_INDEX_REBELLIONS_PASSWORD: REBEL_SW_DEV_PASSWORD
    HF_TOKEN: HF_TOKEN
    HF_HOME: HF_HOME
  timeout_in_minutes: 60
  artifact_paths:
  - debug-siglip343/**/*
  - junit-siglip343.xml
  command:
  - bash scripts/ci/sync.sh
  - mkdir -p debug-siglip343
  - uv run --no-sync python -c 'import importlib.metadata as m,hashlib,json; from
    pathlib import Path; from tvm._ffi import base; v=m.version("rebel-compiler");
    h=hashlib.sha256(Path(base._LIB._name).read_bytes()).hexdigest(); assert v=="0.12.1.dev343+g8f59b810";
    assert h=="44488287fded4255154c870fbd789b1c6ad4d7a5c9e49e39c87d17e191bd1c9a";
    print("SIGLIP2_SDK_RECEIPT "+json.dumps({"version":v,"DSO_sha256":h}))'
  - set -o pipefail; unset TVM_LIBRARY_PATH RBLN_DUMMY_DEVICE SAVE_ARTIFACTS_PATH
    REUSE_ARTIFACTS_PATH; uv run --no-sync pytest -n 1 tests/test_transformers.py
    -k TestSiglip2Model -vv --durations 0 --junitxml=junit-siglip343.xml 2>&1 | tee
    debug-siglip343/runtime.log
- label: ':pytest: Existing SigLIP2 SDK343 RBLN-CR13 B1/2/4/8'
  image: ${DEVTOOLS_DOCKER_IMAGE}
  agents:
