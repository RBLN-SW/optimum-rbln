# Entry pipeline for the tag build, uploaded by optimum-rbln-bc-compile.
# Replaces .github/workflows/bc_compile.yaml.

env:
  BC_BASE_PATH: "${OPTIMUM_BC_BASE_PATH}"
  UV_CACHE_DIR: "${UV_CACHE_PATH}"
  UV_LINK_MODE: "symlink"
  UV_INDEX_STRATEGY: "unsafe-best-match"

steps:
  - label: ":sparkles: upload BC compile"
    checkout:
      sparse:
        paths:
          - .buildkite
    command: |
      steps=$$(bash scripts/bc-compile-steps.sh)
      [ -n "$$steps" ] || exit 0
      printf '%s\n' "$$steps" | buildkite-agent pipeline upload
