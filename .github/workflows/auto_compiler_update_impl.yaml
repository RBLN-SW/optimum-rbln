name: Auto Compiler Update (impl)

on:
  workflow_call:

env:
  TOKEN: ${{ secrets.RENOVATE_TOKEN }}

jobs:
  fetch-version:
    runs-on: rbln-sw-k8s-4c-32gb
    container:
      image: ${{ vars.DEV_CONTAINER_IMAGE }}
    outputs:
      compiler_version: ${{ steps.get_version.outputs.compiler_version }}
      need_pr: ${{ steps.check_pr_needed.outputs.need_pr }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: "dev"

      - name: Get compiler version
        id: get_version
        env:
          OBEDIENTS_API_TOKEN: ${{ secrets.OBEDIENTS_API_TOKEN }}
          OBEDIENTS_API_URL: ${{ secrets.OBEDIENTS_API_URL }}
        run: |
          set -euo pipefail
          API="${OBEDIENTS_API_URL}/v2/organizations/main/pipelines/nightly"
          AUTH="Authorization: Bearer ${OBEDIENTS_API_TOKEN}"

          # 1. Latest passed nightly build on dev (list is newest-first).
          BUILD_NUMBER=$( \
            curl -fsS --retry 5 --retry-max-time 120 -H "$AUTH" \
              "${API}/builds?branch=dev&state=passed&per_page=1" \
            | jq -r '(.items // .)[0].number' \
          )

          # 2. Locate the version manifest artifact produced by that build.
          DL_URL=$( \
            curl -fsS --retry 5 --retry-max-time 120 -H "$AUTH" \
              "${API}/builds/${BUILD_NUMBER}/artifacts" \
            | jq -r '(.items // .)[] | select(.filename=="compiler-nightly-version") | .download_url' \
          )

          # 3. Read VERSION_PROD (download_url is pre-signed, no auth header needed).
          LATEST_VERSION=$(curl -fsSL --retry 5 "$DL_URL" | grep '^VERSION_PROD=' | cut -d '=' -f2-)

          CUR_VERSION=$(grep rebel_compiler_version .github/version.yaml | cut -d ':' -f2 | tr -d ' ')

          echo "Latest (nightly build #${BUILD_NUMBER}): $LATEST_VERSION"
          echo "Current (.github/version.yaml): $CUR_VERSION"

          echo "compiler_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "cur_version=$CUR_VERSION" >> $GITHUB_OUTPUT

      - name: Check if PR needed
        id: check_pr_needed
        run: |
          if [ "${{ steps.get_version.outputs.cur_version }}" == "${{ steps.get_version.outputs.compiler_version }}" ]; then
            NEED_PR=false
          else
            NEED_PR=true
          fi
          echo "need_pr=$NEED_PR" >> $GITHUB_OUTPUT

  create-pr:
    runs-on: rbln-sw-k8s-4c-32gb
    container:
      image: ${{ vars.DEV_CONTAINER_IMAGE }}
    needs: fetch-version
    if: ${{ needs.fetch-version.outputs.need_pr == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "dev"

      - name: Change version.yaml
        run: |
          sed -i "s/^rebel_compiler_version:.*/rebel_compiler_version: ${{ needs.fetch-version.outputs.compiler_version }}/" .github/version.yaml

      - name: Create PR for updated files
        id: create-pr-step
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ env.TOKEN }}
          commit-message: "[pytest-full] [slack-report] dependency: Update dependency rebel-compiler to ${{ needs.fetch-version.outputs.compiler_version }}"
          title: "dependency: Update dependency rebel-compiler to ${{ needs.fetch-version.outputs.compiler_version }}"
          base: dev
          team-reviewers: rbln-sw/sw-generalization
          reviewers: rebel-jongho
