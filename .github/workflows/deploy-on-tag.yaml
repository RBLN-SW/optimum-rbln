name: Deploy package on tag released

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy-on-tag:
    uses: ./.github/workflows/deploy.yaml
    with:
      version: ${{ github.ref_name }}
    secrets:
      PKG_ORG_GATE: ${{ secrets.PKG_ORG_GATE }}

  trigger-vllm-rbln-pkg-update:
    name: trigger vllm-rbln pkg update PR
    needs: [deploy-on-tag]
    runs-on: rbln-sw-k8s-general
    steps:
      - uses: actions/github-script@v8
        env:
          OPTIMUM_VERSION: ${{ github.ref_name }}
        with:
          github-token: ${{ secrets.GIT_PAT }}
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: 'rbln-sw',
              repo: 'vllm-rbln',
              workflow_id: 'dispatch_pkg_update.yaml',
              ref: 'dev',
              inputs: {
                'python-version': '3.12',
                'optimum-version': process.env.OPTIMUM_VERSION,
              }
            })
            console.log(result)
