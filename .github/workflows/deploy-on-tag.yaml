name: Deploy package on tag released

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  check-tag:
    name: Check tag is release
    runs-on: rbln-sw-k8s-4c-32gb
    container:
      image: ${{ vars.DEV_CONTAINER_IMAGE }}
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Determine if tag is a stable release
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strip leading v if present
          TAG="${TAG#v}"

          # Accept: X.Y.Z[.more][.postN|postN]. Reject pre/dev/rc.
          if [[ "$TAG" =~ ^[0-9]+(\.[0-9]+)*(\.post[0-9]+|post[0-9]+)?$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-on-tag:
    uses: ./.github/workflows/deploy.yaml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit

  trigger-vllm-rbln-pkg-update:
    name: trigger vllm-rbln pkg update PR
    needs: [deploy-on-tag]
    runs-on: rbln-sw-k8s-4c-32gb
    container:
      image: ${{ vars.DEV_CONTAINER_IMAGE }}
    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GIT_PAT }}
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: 'rbln-sw',
              repo: 'vllm-rbln',
              workflow_id: 'dispatch_pkg_update.yaml',
              ref: 'dev',
              inputs: {
                'python-version': '3.12',
                'optimum-version': '${{ github.ref_name }}',
              }
            })
            console.log(result)

  trigger-vllm-model-compilation:
    name: trigger vllm model compile and generation ci
    needs: [deploy-on-tag]
    runs-on: rbln-sw-k8s-4c-32gb
    container:
      image: ${{ vars.DEV_CONTAINER_IMAGE }}
    steps:
      - name: Trigger Obedients model-generation pipeline
        env:
          OBEDIENTS_API_TOKEN: ${{ secrets.OBEDIENTS_API_TOKEN }}
          OPTIMUM_RBLN_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || (apt-get update && apt-get install -y jq curl)
          curl -fsS --retry 5 --retry-max-time 120 -X POST \
            "https://obedients-api.k8s.rebellions.in/v2/organizations/main/pipelines/standalone-rebel-compiler-model-generation-vllm-rbln-pr-ci/builds" \
            -H "Authorization: Bearer ${OBEDIENTS_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg ver "$OPTIMUM_RBLN_VERSION" \
              '{commit: "HEAD", branch: "dev",
                message: ("optimum-rbln " + $ver + " → model generation for vllm-rbln CI"),
                env: {OPTIMUM_RBLN_VERSION: $ver, VLLM_RBLN_REF: "dev"}}')"

  bc-compile:
    name: BC compile for release tag
    needs: check-tag
    if: needs.check-tag.outputs.is_release == 'true'
    uses: ./.github/workflows/bc_compile.yaml
    with:
      bc_tag: ${{ github.ref_name }}
    secrets: inherit
