<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {

};
const CONFIRM = [["agree", "맞다"], ["disagree", "틀리다"], ["conditional", "조건부로 맞다"], ["unneeded", "필요 없는 룰이다"], ["unknown", "모른다"], ["forgot", "기억나지 않는다"]];
const TAIL = [["unneeded", "필요 없는 룰이다"], ["unknown", "모른다"], ["forgot", "기억나지 않는다"]];
const STATUS_KO = { interview: "결정 필요", verified: "코드 일치", aspirational: "코드 불일치", supported: "판단형", rejected: "폐기 제안", debate: "미해결 논쟁", proposal: "팀원 제안" };
const GROUP_ORDER = ["proposal", "interview", "debate", "aspirational", "verified", "supported", "rejected"];
const GROUP_NOTE = { proposal: "팀원이 직접 제안한 룰입니다. 동의 여부를 고르고 댓글로 다듬어 주세요.", interview: "근거가 서로 반대이거나 코드에 두 방식이 공존합니다. 어느 쪽인지 골라 주세요.", debate: "PR 토론에서 결론이 나지 않은 질문입니다.", aspirational: "팀 의도는 분명하지만 현재 코드가 따르지 않는 룰입니다. 채택하면 고칠 코드가 생깁니다.", verified: "현재 코드가 따르는 룰입니다.", supported: "코드로 검사할 수 없는 판단형 룰입니다.", rejected: "코드가 일관되게 다르게 하거나 룰의 대상이 사라져 폐기를 제안합니다. 폐기에 동의하면 '맞다'를 고르세요." };
const PALETTE = ["#2b5fd9", "#b4432f", "#9a6700", "#1f7a4d", "#7a4fc9", "#5b6b85"];
const PR = "https://github.com/rebellions-sw/optimum-rbln/pull/";
const S = { data: null, areaKey: null, db: null, user: null, uid: null, canWrite: null, answers: new Map(), notes: new Map(), proposals: [], pdraft: {}, unsub: [], profiles: {}, writes: new Map(), summary: null };

const esc = s => String(s ?? "");
const tok = key => key.replace(/\//g, "-");
const safeId = s => String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g, "-");

function areas() {
  const base = S.data.areas.map(a => ({ key: a.key, label: a.label, items: S.data.items.filter(i => i.area === a.key) })).filter(a => a.items.length);
  if (S.data.debates.length) base.push({ key: "debates", label: "미해결 논쟁", items: S.data.debates });

}
function itemsOf(key) { const a = areas().find(a => a.key === key); return a ? a.items : []; }
function optionsOf(item) {

function myAnswer(id) { return S.uid ? S.answers.get(id + "__" + safeId(S.uid)) : null; }

/* ---------- rendering ---------- */

  };

  nav.append(el("li", { class: "sep" }));
  for (const a of areas()) li(a.key, a.label, a.items.length, S.uid ? a.items.filter(i => myAnswer(i.id)?.answer).length : null);
  sel.onchange = () => go(sel.value);

function go(key) {

}
function renderArea() {

      const chip = c.querySelector(".chip.mine"); if (mine?.answer && !chip) c.querySelector(".head").append(el("span", { class: "chip mine", text: "응답함" })); if (!mine?.answer && chip) chip.remove();
      const ta = document.getElementById("memo-" + it.id); if (ta && document.activeElement !== ta && (mine?.memo || "") !== ta.value) ta.value = mine?.memo || "";
      paintTally(it); }
    renderNav();
  }, e => toast("응답 동기화가 끊겼습니다. 새로고침해 주세요."));
  const u2 = S.db.collection("notes").where("area", "==", key).onSnapshot(snap => {
    S.notes.clear(); for (const d of snap.docs) S.notes.set(d.id, { ...d.data(), _id: d.id });
    for (const it of items) paintThread(it);
  }, e => {});
  S.unsub.push(u1, u2);
}

/* ---------- summary ---------- */
async function renderSummary() {
  const v = $("#view"); v.replaceChildren(el("h1", { text: "집계" }), el("p", { class: "lede", text: "영역별 응답 현황. 합의는 '모른다·기억나지 않는다'를 뺀 응답자의 80% 이상이 같은 답을 고른 룰, 갈림은 서로 다른 답이 각각 2명 이상인 룰입니다." }));
  if (!S.db) { v.append(el("p", { class: "empty", text: "공유 저장소에 연결되지 않아 집계를 볼 수 없습니다." })); return; }
  const table = el("table", { class: "sum" }, el("thead", {}, el("tr", {}, ...["영역", "룰", "응답자", "응답률", "합의", "갈림", "미응답 룰"].map((h, i) => el("th", { class: i ? "n" : "", text: h })))));
  const tb = el("tbody"); table.append(tb); v.append(el("div", { class: "tablewrap" }, table));
  const splitList = el("div");
  v.append(el("div", { class: "group" }, el("h2", { text: "갈린 룰" })), splitList);
  let totalSplit = 0;
  for (const a of areas()) {
    let docs = [];
    try { docs = (await S.db.collection("answers").where("area", "==", a.key).get()).docs.map(d => d.data()).filter(d => d.answer); } catch (e) {}
    const users = new Set(docs.map(d => d.uid));
    let agree = 0, split = 0, unanswered = 0;
    for (const it of a.items) {
      const rows = docs.filter(d => d.item === it.id); if (!rows.length) { unanswered++; continue; }
      const real = rows.filter(r => !["unknown", "forgot"].includes(r.answer));
      const counts = {}; for (const r of real) counts[r.answer] = (counts[r.answer] || 0) + 1;
      const vals = Object.values(counts).sort((x, y) => y - x);
      if (real.length && vals[0] / real.length >= .8) agree++;
      if (vals.length > 1 && vals[1] >= 2) { split++; totalSplit++;
        const names = {}; splitList.append(el("p", { class: "q" }, el("span", { class: "id", text: it.id }), " ", it.rule, " ", el("span", { class: "who", text: Object.entries(counts).map(([k, n]) => `${labelOf(it, k)} ${n}`).join(" · ") }))); }
    }
    const rate = users.size ? Math.round(100 * docs.length / (a.items.length * users.size)) : 0;
    tb.append(el("tr", {}, el("td", {}, el("a", { href: "#" + tok(a.key), text: a.label, onclick: e => { e.preventDefault(); go(a.key); } })),
      el("td", { class: "n", text: a.items.length }), el("td", { class: "n", text: users.size }), el("td", { class: "n", text: rate + "%" }),
      el("td", { class: "n agree", text: agree }), el("td", { class: "n" + (split ? " split" : ""), text: split }), el("td", { class: "n", text: unanswered })));
  }
  if (!totalSplit) splitList.append(el("p", { class: "empty", text: "아직 갈린 룰이 없습니다." }));
}
function labelOf(it, k) { const o = optionsOf(it).find(o => o[0] === k); return o ? o[1] : k; }

/* ---------- boot ---------- */
async function boot() {
  try { S.data = await (await fetch("review_data.json", { cache: "no-store" })).json(); }
  catch (e) { $("#view").replaceChildren(el("p", { class: "notice warn", text: "룰 데이터를 불러오지 못했습니다. 새로고침해 주세요." })); return; }
  const want = (location.hash || "").slice(1);
  const found = want === "summary" ? "summary" : areas().find(a => tok(a.key) === want)?.key;
  S.areaKey = found || areas()[0].key;
  renderNav(); if (S.areaKey === "summary") renderSummary(); else renderArea();
  const use = n => (window.claude && typeof window.claude.use === "function") ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [user, db] = await Promise.all([use("user"), use("db")]);
  S.user = user; S.db = db; S.dbResolved = true;
  if (user) {
    try { const me = await user.me(); S.uid = me.id; S.canWrite = await user.can("data.write");
      const box = $("#me"); box.hidden = false; $("#me-img").src = me.avatarUrl; $("#me-name").textContent = me.name || "나"; $("#me-role").textContent = S.uid ? (S.canWrite === false ? " · 읽기 전용" : "") : " · 로그인 필요"; } catch (e) {}
  }
  if (S.areaKey === "summary") renderSummary(); else { renderArea(); subscribe(S.areaKey); }
  subscribeProposals();
  renderNav();
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); const k = h === "summary" ? "summary" : areas().find(a => tok(a.key) === h)?.key; if (k && k !== S.areaKey) go(k); });
boot();
})();
